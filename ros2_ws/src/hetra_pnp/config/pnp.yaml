pnp_node:
  ros__parameters:
    # marker_map_file defaults to <share>/config/marker_map.yaml (launch arg overrides it)
    dictionary: ""               # "" = use the marker map's dictionary
    detector: aruco              # AprilTag: keep "aruco" and set dictionary DICT_APRILTAG_36h11
    corner_refinement: subpix    # none | subpix | contour | apriltag
    max_reproj_error: 3.0        # px RMS per marker; worse markers are dropped and the pose re-solved

    world_frame: world
    camera_frame: ""             # "" = frame_id of the incoming image
    forearm_frame: forearm
    # Pose of the forearm frame expressed in the camera (optical) frame.
    # Measure once the mount is designed. Identity = report the camera pose.
    cam_to_forearm_xyz: [0.0, 0.0, 0.0]
    cam_to_forearm_rpy_deg: [0.0, 0.0, 0.0]

    # IMU flip resolution for the single-marker case (only gravity is used, so a
    # drifting yaw on a 6-axis IMU is fine). Orientation of the IMU frame in the camera frame:
    use_imu: false
    imu_topic: /imu/data
    imu_max_age: 0.2             # s
    cam_to_imu_rpy_deg: [0.0, 0.0, 0.0]
    world_up: [0.0, 0.0, 1.0]    # must match marker_map.yaml (z up)

    fallback_hfov_deg: 60.0      # only used while camera_info is uncalibrated
    publish_tf: true
    publish_debug_image: true
    stats_every_n_frames: 150    # log detect/solve/latency stats (0 = off)

    # Heuristic covariance (tune against ground truth later)
    cov_pos_sigma: 0.01          # m, multi-marker baseline
    cov_rot_sigma_deg: 1.0
    cov_single_factor: 4.0
    cov_single_no_imu_factor: 2.0
